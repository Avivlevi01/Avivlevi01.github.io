<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">How the site updates itself</title>
<desc id="d">Code changes: my public repos. Then Nightly agent: reads what changed. Then Update: site and resume. Then Checks: must all pass. Then Live: GitHub Pages.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.packet{animation:go 10s ease-in-out infinite}@keyframes go{0%,8%{transform:translateX(0)}20%,28%{transform:translateX(240px)}40%,48%{transform:translateX(480px)}60%,68%{transform:translateX(720px)}80%,88%{transform:translateX(960px)}100%{transform:translateX(960px)}}
.lit{opacity:0;animation:lit 10s ease-in-out infinite both}
@keyframes lit{0%{opacity:1}12%{opacity:1}18%,98%{opacity:0}100%{opacity:1}}
.l1{animation-delay:-8s}.l2{animation-delay:-6s}.l3{animation-delay:-4s}.l4{animation-delay:-2s}
@media (prefers-reduced-motion:reduce){.packet{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="300" rx="26" fill="#06143F"/><path d="M120 112H1080" stroke="#2A4796" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/><circle class="packet" cx="120" cy="112" r="11" fill="#FF8A4C"/><circle cx="120" cy="112" r="50" fill="#0A1F5C" stroke="#2A4796" stroke-width="3"/><circle class="lit l0" cx="120" cy="112" r="50" fill="#1F5BFF" stroke="#7CC4FF" stroke-width="5"/><g transform="translate(120 112)" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="M-10-12L-22 0L-10 12M10-12L22 0L10 12M5-17L-5 17"/></g><text x="120" y="208" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Code changes</text><text x="120" y="242" font-size="21" font-weight="400" fill="#B9CDF5" text-anchor="middle">my public repos</text><circle cx="360" cy="112" r="50" fill="#0A1F5C" stroke="#2A4796" stroke-width="3"/><circle class="lit l1" cx="360" cy="112" r="50" fill="#1F5BFF" stroke="#7CC4FF" stroke-width="5"/><g transform="translate(360 112)" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><rect x="-19" y="-11" width="38" height="29" rx="8"/><path d="M0-11V-21M-27 0V8M27 0V8"/><circle cx="-8" cy="2" r="3"/><circle cx="8" cy="2" r="3"/><path d="M-8 11H8"/></g><text x="360" y="208" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Nightly agent</text><text x="360" y="242" font-size="21" font-weight="400" fill="#B9CDF5" text-anchor="middle">reads what changed</text><circle cx="600" cy="112" r="50" fill="#0A1F5C" stroke="#2A4796" stroke-width="3"/><circle class="lit l2" cx="600" cy="112" r="50" fill="#1F5BFF" stroke="#7CC4FF" stroke-width="5"/><g transform="translate(600 112)" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 18L-14 4L9-19L19-9L-4 14ZM3-13L13-3"/></g><text x="600" y="208" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Update</text><text x="600" y="242" font-size="21" font-weight="400" fill="#B9CDF5" text-anchor="middle">site and resume</text><circle cx="840" cy="112" r="50" fill="#0A1F5C" stroke="#2A4796" stroke-width="3"/><circle class="lit l3" cx="840" cy="112" r="50" fill="#1F5BFF" stroke="#7CC4FF" stroke-width="5"/><g transform="translate(840 112)" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="M0-22L19-14V1C19 12 11 19 0 23C-11 19-19 12-19 1V-14ZM-9 0L-2 7L10-7"/></g><text x="840" y="208" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Checks</text><text x="840" y="242" font-size="21" font-weight="400" fill="#B9CDF5" text-anchor="middle">must all pass</text><circle cx="1080" cy="112" r="50" fill="#0A1F5C" stroke="#2A4796" stroke-width="3"/><circle class="lit l4" cx="1080" cy="112" r="50" fill="#1F5BFF" stroke="#4ADE80" stroke-width="5"/><g transform="translate(1080 112)" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><circle r="21"/><path d="M-21 0H21M0-21C-13-8-13 8 0 21C13 8 13-8 0-21"/></g><text x="1080" y="208" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Live</text><text x="1080" y="242" font-size="21" font-weight="400" fill="#B9CDF5" text-anchor="middle">GitHub Pages</text>
</svg>
