<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Aviv Levi portfolio: a site that updates itself</title>
<desc id="d">A browser window with the portfolio site refreshes its project cards. Automated scripts and AI agents.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.snow{animation:fall linear infinite}.s1{animation-duration:22s}.s2{animation-duration:13s}@keyframes fall{to{transform:translateY(360px)}}
.float{animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}
.spin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.card{animation:card 8s ease-in-out infinite}.k1{animation-delay:.35s}.k2{animation-delay:.7s}
@keyframes card{0%,55%,100%{transform:none;opacity:1}62%{transform:translateY(14px);opacity:.15}74%{transform:none;opacity:1}}
.badge{transform-origin:1089px 210px;animation:badge 8s ease-out infinite}
@keyframes badge{0%,55%{opacity:1;transform:scale(1)}62%,70%{opacity:0;transform:scale(.4)}78%{opacity:1;transform:scale(1.18)}84%,100%{opacity:1;transform:scale(1)}}
.under{transform-origin:62px 265px;animation:under 1.2s ease-out both}@keyframes under{from{transform:scaleX(.1)}}
.flag{transform-origin:950px 102px;animation:wave 2.4s ease-in-out infinite}@keyframes wave{50%{transform:scaleX(.8) skewY(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
